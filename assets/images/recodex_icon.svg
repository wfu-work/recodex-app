<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Recodex</title>
  <desc id="desc">A flat blue command prompt mark with a connection status dot</desc>

  <!-- A single solid field keeps the mark crisp at launcher sizes. -->
  <rect width="1024" height="1024" rx="224" fill="#2563EB"/>

  <!-- Command prompt: the core Recodex connection to a Codex host. -->
  <path d="M260 330 455 512 260 694" fill="none" stroke="#FFFFFF" stroke-width="78" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M535 694h230" fill="none" stroke="#FFFFFF" stroke-width="78" stroke-linecap="round"/>

  <!-- Small status dot adds the remote, always-connected identity. -->
  <circle cx="780" cy="260" r="36" fill="#34D399"/>
</svg>
