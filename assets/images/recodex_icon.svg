<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Recodex</title>
  <desc id="desc">A blue-violet command prompt bubble on a soft rounded tile</desc>
  <defs>
    <linearGradient id="paper" x1="210" y1="128" x2="814" y2="896" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
    <linearGradient id="bubble" x1="298" y1="289" x2="686" y2="733" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b8b5ff"/>
      <stop offset=".42" stop-color="#6fa7ff"/>
      <stop offset="1" stop-color="#3448f4"/>
    </linearGradient>
    <radialGradient id="shine" cx="42%" cy="28%" r="58%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".72"/>
      <stop offset=".56" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="230" fill="url(#paper)"/>
  <g transform="translate(512 512) scale(1.32) translate(-512 -512)">
    <rect x="216" y="231" width="592" height="562" rx="188" fill="url(#bubble)"/>
    <ellipse cx="512" cy="301" rx="226" ry="98" fill="url(#shine)"/>
    <path d="M336 404 436 506 336 608" fill="none" stroke="#edf6ff" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M522 620h166" fill="none" stroke="#edf6ff" stroke-width="52" stroke-linecap="round"/>
  </g>
</svg>
